<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src  'self' https://appsforoffice.microsoft.com https://cdn.quilljs.com https://cdn.jsdelivr.net 'unsafe-eval';
    style-src   'self' https://cdn.quilljs.com https://cdn.jsdelivr.net 'unsafe-inline';
    font-src    'self' https://cdn.quilljs.com https://cdn.jsdelivr.net;
    img-src     'self' data:;
    connect-src 'self' https://appsforoffice.microsoft.com;
  "/>
  <title>RichCell</title>

  <!-- Office.js (must load before any other script) -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <!-- Quill.js snow theme -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet"/>
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

  <link rel="stylesheet" href="taskpane.css"/>
</head>
<body>

  <div id="app">

    <!-- Header -->
    <div id="header">
      <div id="header-title">
        <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <h2>RichCell</h2>
      </div>
      <div id="cell-info">
        <span id="cell-address-label" data-i18n="activeCellLabel">Active cell:</span>
        <span id="cell-address">—</span>
        <span id="unsaved-indicator" data-i18n-title="unsavedTitle" title="Unsaved changes in Excel" hidden>●</span>
      </div>
    </div>

    <!-- WYSIWYG Editor -->
    <div id="editor-container">
      <!-- Custom Quill toolbar -->
      <div id="toolbar">
        <span class="ql-formats">
          <select class="ql-header" data-i18n-title="headerTooltip" title="Heading">
            <option value="1">H1</option>
            <option value="2">H2</option>
            <option selected>Normal</option>
          </select>
        </span>
        <span class="ql-formats">
          <button class="ql-bold"   data-i18n-title="boldTooltip"   title="Bold (Ctrl+B)"></button>
          <button class="ql-italic" data-i18n-title="italicTooltip" title="Italic (Ctrl+I)"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-list" value="bullet"  data-i18n-title="bulletTooltip"  title="Bullet list"></button>
          <button class="ql-list" value="ordered" data-i18n-title="orderedTooltip" title="Numbered list"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-link"  data-i18n-title="linkTooltip"  title="Insert link"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-clean" data-i18n-title="cleanTooltip" title="Remove all formatting"></button>
        </span>
      </div>

      <!-- Quill editor area -->
      <div id="editor"></div>
    </div>

    <!-- Rendered preview (collapsible) -->
    <details id="render-preview-section">
      <summary data-i18n="renderPreviewTitle">Rendered preview</summary>
      <div id="render-preview"></div>
    </details>

    <!-- Raw HTML preview (collapsible) -->
    <details id="html-preview-section">
      <summary data-i18n="htmlPreviewTitle">HTML preview</summary>
      <pre id="html-preview"></pre>
    </details>

    <!-- Action buttons -->
    <div id="actions">
      <button id="btn-send" class="btn-primary" data-i18n-title="sendButtonTitle" title="Write HTML content to the selected cell (Ctrl+Enter)">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"/>
          <path d="M22 2L15 22 11 13 2 9l20-7z"/>
        </svg>
        <span data-i18n="sendButton">Send to Excel</span>
      </button>
      <button id="btn-undo" class="btn-secondary" data-i18n-title="undoButtonTitle" title="Restore the original cell content" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-4"/>
        </svg>
        <span data-i18n="undoButton">Undo</span>
      </button>
      <button id="btn-clear" class="btn-secondary" data-i18n-title="clearButtonTitle" title="Clear the editor">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
        <span data-i18n="clearButton">Clear</span>
      </button>
    </div>

    <!-- Status bar -->
    <div id="status-bar">
      <span id="status-message"></span>
    </div>

  </div>

  <script src="i18n.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
